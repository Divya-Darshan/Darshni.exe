<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #121212;
      --card-bg: #1a1a1a;
      --border-color: #2a2a2a;
      --accent: #9ca3af;
      --text-main: #e5e7eb;
      --text-muted: #737373;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 12px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      color: var(--text-main);
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      max-width: 1000px;
      margin: 0 auto;
      text-align: center;
      width: 100%;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 400;
      margin: 0 0 6px;
      color: var(--text-main);
    }

    h1 a {
      color: var(--text-main);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    h1 a:hover {
      color: #fff;
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    #root {
      width: 100%;
      margin-inline: auto;
      max-width: 1000px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }

    @media (min-width: 768px) {
      #root {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .card-base {
      position: relative;
      border-radius: var(--radius);
      padding: 12px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .image-wrapper,
    .video-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      aspect-ratio: 16 / 9;
    }

    .image-shell,
    .video-shell {
      position: relative;
      width: 100%;
      height: 100%;
    }

    img.preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .lazy-blur {
      filter: blur(8px);
    }

    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      padding-inline: 2px;
      gap: 10px;
    }

    .date {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: 4px;
      background: #262626;
      color: var(--success);
      flex-shrink: 0;
    }

    .status.pending {
      color: var(--warning);
    }

    .status.error {
      color: var(--danger);
    }

    .sub-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--text-muted);
      padding-inline: 2px;
    }

    .chip-row {
      display: flex;
      gap: 6px;
    }

    .chip {
      padding: 2px 6px;
      border-radius: 4px;
      background: #222;
      border: 1px solid var(--border-color);
    }

    .index-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* VIDEO specific */
    .video-card {
      grid-column: 1 / -1;
    }

    .video-shell video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      border-radius: 8px;
    }

    .video-badge {
      right: 10px;
      left: auto;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
</head>
<body>
  <header>
    <h1>
      Progress Tracker &mdash; <a href="https://github.com/divya-darshan/darshni.exe" target="_blank" rel="noreferrer">repo</a>
    </h1>
    <div class="subtitle">
      Timeline &middot; EXIF-driven capture logs
    </div>
  </header>

  <div id="root"></div>

<script>
  const root = document.getElementById("root");
  const TOTAL_IMAGES = 20;
  const VIDEO_PATHS = [
    "char/models/main-blender-mobel/darshni-render/testout/sample.mkv",
  ];

  function createVideoCard(src, labelText) {
    const card = document.createElement("div");
    card.className = "card-base video-card";

    const wrapper = document.createElement("div");
    wrapper.className = "video-wrapper";

    const shell = document.createElement("div");
    shell.className = "video-shell";

    const video = document.createElement("video");
    video.controls = true;
    video.preload = "metadata";
    video.src = src;

    shell.appendChild(video);
    wrapper.appendChild(shell);

    const badge = document.createElement("div");
    badge.className = "badge video-badge";
    badge.textContent = labelText;
    wrapper.appendChild(badge);

    const meta = document.createElement("div");
    meta.className = "meta";

    const date = document.createElement("div");
    date.className = "date";
    date.textContent = "Trailer · 16:9 space";

    const status = document.createElement("div");
    status.className = "status";
    status.textContent = "playable";

    meta.appendChild(date);
    meta.appendChild(status);

    card.appendChild(wrapper);
    card.appendChild(meta);

    if ("IntersectionObserver" in window) {
      const vObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting && !video.paused) {
              video.pause();
            }
          });
        },
        { threshold: 0.2 }
      );
      vObserver.observe(card);
    }

    return card;
  }

  function createImageCard(index) {
    const card = document.createElement("div");
    card.className = "card-base";
    card.dataset.index = index;

    const wrapper = document.createElement("div");
    wrapper.className = "image-wrapper";

    const shell = document.createElement("div");
    shell.className = "image-shell";

    const imgPNG = document.createElement("img");
    imgPNG.className = "preview lazy-blur";
    imgPNG.loading = "lazy";
    imgPNG.dataset.src = `./img/c${index}.png`;
    imgPNG.alt = `Image ${index}`;

    imgPNG.onerror = () => {
      imgPNG.classList.remove("lazy-blur");
      imgPNG.src = "";
      if (!imgPNG._placeholderAdded) {
        const label = document.createElement("div");
        label.textContent = "no image";
        label.style.position = "absolute";
        label.style.inset = "0";
        label.style.display = "flex";
        label.style.alignItems = "center";
        label.style.justifyContent = "center";
        label.style.fontSize = "11px";
        label.style.letterSpacing = "0.1em";
        label.style.textTransform = "uppercase";
        label.style.color = "var(--text-muted)";
        label.style.background = "#181818";
        shell.appendChild(label);
        imgPNG._placeholderAdded = true;
      }
    };

    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = `#${index.toString().padStart(2, "0")}`;

    shell.appendChild(imgPNG);
    wrapper.appendChild(shell);
    wrapper.appendChild(badge);

    const meta = document.createElement("div");
    meta.className = "meta";

    const date = document.createElement("div");
    date.className = "date";
    date.textContent = "Waiting for EXIF…";

    const status = document.createElement("div");
    status.className = "status pending";
    status.textContent = "pending";

    meta.appendChild(date);
    meta.appendChild(status);

    const subMeta = document.createElement("div");
    subMeta.className = "sub-meta";

    const chipRow = document.createElement("div");
    chipRow.className = "chip-row";

    const c1 = document.createElement("div");
    c1.className = "chip";
    c1.textContent = "log";

    const c2 = document.createElement("div");
    c2.className = "chip";
    c2.textContent = "EXIF";

    chipRow.appendChild(c1);
    chipRow.appendChild(c2);

    const idxLabel = document.createElement("div");
    idxLabel.className = "index-label";
    idxLabel.textContent = `FRAME ${index.toString().padStart(2, "0")}`;

    subMeta.appendChild(chipRow);
    subMeta.appendChild(idxLabel);

    card.appendChild(wrapper);
    card.appendChild(meta);
    card.appendChild(subMeta);

    card._img = imgPNG;
    card._date = date;
    card._status = status;

    return card;
  }

  const imageCards = [];
  for (let i = 1; i <= TOTAL_IMAGES; i++) {
    imageCards.push(createImageCard(i));
  }

  const allCards = [...imageCards];

  VIDEO_PATHS.forEach((src, idx) => {
    const label = `trailer ${idx + 1}`;
    const videoCard = createVideoCard(src, label);
    const min = 1;
    const max = allCards.length - 1;
    const insertIndex = Math.floor(Math.random() * (max - min + 1)) + min;
    allCards.splice(insertIndex, 0, videoCard);
  });

  allCards.forEach((card) => root.appendChild(card));

  const options = {
    root: null,
    rootMargin: "120px",
    threshold: 0.12,
  };

  function loadCardData(entry, observer) {
    const card = entry.target;
    const idx = card.dataset.index;
    if (!idx) {
      observer.unobserve(card);
      return;
    }

    const imgPNG = card._img;
    const dateEl = card._date;
    const statusEl = card._status;

    if (imgPNG && imgPNG.dataset.src) {
      imgPNG.src = imgPNG.dataset.src;
      imgPNG.addEventListener("load", () => {
        imgPNG.classList.remove("lazy-blur");
      });
      delete imgPNG.dataset.src;
    }

    const imgJPG = new Image();
    imgJPG.src = `./img_jpg/c${idx}.jpg`;
    imgJPG.style.display = "none";

    imgJPG.onload = () => {
      EXIF.getData(imgJPG, function () {
        const raw =
          EXIF.getTag(this, "DateTimeOriginal") ||
          EXIF.getTag(this, "DateTimeDigitized") ||
          EXIF.getTag(this, "DateTime");

        if (raw) {
          const formatted = raw.replace(
            /^(\d{4}):(\d{2}):(\d{2})/,
            "$1-$2-$3"
          );
          dateEl.textContent = `Captured: ${formatted}`;
          statusEl.textContent = "logged";
          statusEl.classList.remove("pending", "error");
        } else {
          dateEl.textContent = "No EXIF date found";
          statusEl.textContent = "no-meta";
          statusEl.classList.remove("pending");
          statusEl.classList.add("error");
        }
      });
    };

    imgJPG.onerror = () => {
      dateEl.textContent = "Metadata missing";
      statusEl.textContent = "missing";
      statusEl.classList.remove("pending");
      statusEl.classList.add("error");
    };

    card.appendChild(imgJPG);
    observer.unobserve(card);
  }

  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      loadCardData(entry, obs);
    });
  }, options);

  allCards.forEach((card) => {
    if (card.dataset && card.dataset.index) {
      observer.observe(card);
    }
  });
</script>
</body>
</html>
