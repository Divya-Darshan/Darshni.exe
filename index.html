<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress 😅👍</title> <!-- sh!t code 🥲23/12/25 -->

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #020617;
      --accent: #38bdf8;
      --accent-2: #a855f7;
      --accent-soft: rgba(56, 189, 248, 0.25);
      --danger: #fb7185;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --glass-border: rgba(148, 163, 184, 0.35);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --transition-fast: 0.18s ease;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
      margin: 0;
      padding: 18px;
      min-height: 100vh;
      color: var(--text-main);
      background:
        radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.18), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.22), transparent 55%),
        linear-gradient(135deg, #020617 0%, #020617 100%);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      max-width: 1120px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      font-size: clamp(1.35rem, 3.3vw, 1.8rem);
      font-weight: 500;
      margin: 0 0 6px;
    }

    h1 a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dashed rgba(56, 189, 248, 0.6);
      padding-bottom: 2px;
    }

    h1 a:hover {
      border-bottom-style: solid;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .subtitle span {
      color: var(--accent);
    }

    #root {
      width: 100%;
      margin-inline: auto;
      max-width: 1120px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 26px;
    }

    @media (min-width: 1100px) {
      #root {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 14px;
      }
      #root {
        gap: 20px;
      }
    }

    .card-base {
      position: relative;
      border-radius: var(--radius-xl);
      padding: 14px;
      background: linear-gradient(
          135deg,
          rgba(15, 23, 42, 0.94),
          rgba(15, 23, 42, 0.86)
        );
      border: 1px solid var(--glass-border);
      box-shadow:
        0 26px 70px rgba(15, 23, 42, 1),
        0 0 0 1px rgba(15, 23, 42, 1) inset;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      transform-origin: center;
      transition:
        transform var(--transition-fast),
        border-color var(--transition-fast),
        box-shadow var(--transition-fast),
        background var(--transition-fast);
    }

    .card-base::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.16), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.18), transparent 55%);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-fast);
      mix-blend-mode: screen;
    }

    .card-base::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        transparent 0%,
        rgba(148, 163, 184, 0.08) 40%,
        transparent 70%
      );
      opacity: 0;
      transform: translateX(-20%);
      pointer-events: none;
      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
      mix-blend-mode: screen;
    }

    .card-base:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: var(--accent-soft);
      box-shadow:
        0 30px 80px rgba(15, 23, 42, 1),
        0 0 22px rgba(56, 189, 248, 0.35);
    }

    .card-base:hover::before {
      opacity: 1;
    }

    .card-base:hover::after {
      opacity: 1;
      transform: translateX(5%);
    }

    .image-wrapper,
    .video-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-lg);
      background: radial-gradient(circle at 50% 50%, #020617, #020617);
      aspect-ratio: 16 / 9;
    }

    .image-shell,
    .video-shell {
      position: relative;
      width: 100%;
      height: 100%;
    }

    img.preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: radial-gradient(circle at 50% 50%, #020617, #020617);
      border-radius: var(--radius-lg);
      transform: translateZ(0);
      transition: transform 0.28s ease, filter 0.28s ease;
      filter: saturate(1.05) contrast(1.03);
    }

    .lazy-blur {
      filter: blur(10px) saturate(1.1);
      transform: scale(1.01);
    }

    .card-base:hover img.preview {
      transform: scale(1.02);
      filter: saturate(1.15) contrast(1.06);
    }

    .badge {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      border: 1px solid rgba(148, 163, 184, 0.7);
      backdrop-filter: blur(8px);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
    }

    .badge-text {
      opacity: 0.82;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      padding-inline: 3px;
      gap: 10px;
    }

    .date {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: radial-gradient(
        circle at 0 0,
        rgba(56, 189, 248, 0.16),
        transparent 65%
      );
      color: #6ee7b7;
      flex-shrink: 0;
    }

    .status.pending {
      color: #fbbf24;
      background: radial-gradient(
        circle at 0 0,
        rgba(251, 191, 36, 0.16),
        transparent 65%
      );
    }

    .status.error {
      color: var(--danger);
      background: radial-gradient(
        circle at 0 0,
        rgba(248, 113, 113, 0.16),
        transparent 65%
      );
    }

    .sub-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #6b7280;
      padding-inline: 3px;
      margin-top: 2px;
    }

    .chip-row {
      display: flex;
      gap: 6px;
    }

    .chip {
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.9);
    }

    .index-label {
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* VIDEO specific */
    .video-card {
      grid-column: 1 / -1; /* full row width */
    }

    .video-shell video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      border-radius: var(--radius-lg);
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-lg);
      pointer-events: none;
      background: radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.18), transparent 55%);
      mix-blend-mode: screen;
    }

    .video-badge {
      right: 14px;
      left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .video-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #ef4444;
      box-shadow: 0 0 14px rgba(248, 113, 113, 1);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
</head>
<body>
  <header>
    <h1>
      if still there no Progress!, i believe you on [29-11-25]🫂
      <a href="https://github.com/divya-darshan/darshni.exe" target="_blank" rel="noreferrer">
        repo
      </a>
    </h1>
    <div class="subtitle">
      one **timeline** · <span>EXIF-driven</span> capture logs · huge 16:9 frames + trailer.
    </div>
  </header>

  <div id="root"></div>

<script>
  const root = document.getElementById("root");
  const TOTAL_IMAGES = 20;
  const VIDEO_PATHS = [
    // add more paths here when you have more videos
    "char/models/main-blender-mobel/darshni-render/testout/sample.mkv",
  ];

  function createVideoCard(src, labelText) {
    const card = document.createElement("div");
    card.className = "card-base video-card";

    const wrapper = document.createElement("div");
    wrapper.className = "video-wrapper";

    const shell = document.createElement("div");
    shell.className = "video-shell";

    const video = document.createElement("video");
    video.controls = true;
    video.preload = "metadata";
    video.src = src;

    const overlay = document.createElement("div");
    overlay.className = "video-overlay";

    shell.appendChild(video);
    shell.appendChild(overlay);
    wrapper.appendChild(shell);

    const badge = document.createElement("div");
    badge.className = "badge video-badge";
    badge.innerHTML = `
      <span class="video-dot"></span>
      <span class="badge-text">${labelText}</span>
    `;
    wrapper.appendChild(badge);

    const meta = document.createElement("div");
    meta.className = "meta";

    const date = document.createElement("div");
    date.className = "date";
    date.textContent = "Trailer · full 16:9 space";

    const status = document.createElement("div");
    status.className = "status";
    status.textContent = "playable";

    meta.appendChild(date);
    meta.appendChild(status);

    card.appendChild(wrapper);
    card.appendChild(meta);

    // optional: auto-pause when off-screen
    if ("IntersectionObserver" in window) {
      const vObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting && !video.paused) {
              video.pause();
            }
          });
        },
        { threshold: 0.2 }
      );
      vObserver.observe(card);
    }

    return card;
  }

  function createImageCard(index) {
    const card = document.createElement("div");
    card.className = "card-base";
    card.dataset.index = index;

    const wrapper = document.createElement("div");
    wrapper.className = "image-wrapper";

    const shell = document.createElement("div");
    shell.className = "image-shell";

    const imgPNG = document.createElement("img");
    imgPNG.className = "preview lazy-blur";
    imgPNG.loading = "lazy";
    imgPNG.dataset.src = `./img/c${index}.png`;
    imgPNG.alt = `Image ${index}`;

    imgPNG.onerror = () => {
      imgPNG.classList.remove("lazy-blur");
      imgPNG.style.objectFit = "contain";
      imgPNG.style.background = "#ffffff";
      imgPNG.style.filter = "none";
      imgPNG.src = "";
      if (!imgPNG._placeholderAdded) {
        const label = document.createElement("div");
        label.textContent = "no image";
        label.style.position = "absolute";
        label.style.inset = "0";
        label.style.display = "flex";
        label.style.alignItems = "center";
        label.style.justifyContent = "center";
        label.style.fontSize = "12px";
        label.style.letterSpacing = "0.16em";
        label.style.textTransform = "uppercase";
        label.style.color = "#9ca3af";
        label.style.background = "#ffffff";
        shell.appendChild(label);
        imgPNG._placeholderAdded = true;
      }
    };

    const badge = document.createElement("div");
    badge.className = "badge";
    badge.innerHTML = `
      <span class="badge-dot"></span>
      <span class="badge-text">#${index.toString().padStart(2, "0")} · log</span>
    `;

    shell.appendChild(imgPNG);
    wrapper.appendChild(shell);
    wrapper.appendChild(badge);

    const meta = document.createElement("div");
    meta.className = "meta";

    const date = document.createElement("div");
    date.className = "date";
    date.textContent = "Waiting for EXIF…";

    const status = document.createElement("div");
    status.className = "status pending";
    status.textContent = "pending";

    meta.appendChild(date);
    meta.appendChild(status);

    const subMeta = document.createElement("div");
    subMeta.className = "sub-meta";

    const chipRow = document.createElement("div");
    chipRow.className = "chip-row";

    const c1 = document.createElement("div");
    c1.className = "chip";
    c1.textContent = "capture log";

    const c2 = document.createElement("div");
    c2.className = "chip";
    c2.textContent = "EXIF watch";

    chipRow.appendChild(c1);
    chipRow.appendChild(c2);

    const idxLabel = document.createElement("div");
    idxLabel.className = "index-label";
    idxLabel.textContent = `FRAME ${index.toString().padStart(2, "0")}`;

    subMeta.appendChild(chipRow);
    subMeta.appendChild(idxLabel);

    card.appendChild(wrapper);
    card.appendChild(meta);
    card.appendChild(subMeta);

    card._img = imgPNG;
    card._date = date;
    card._status = status;

    return card;
  }

  // build all image cards first
  const imageCards = [];
  for (let i = 1; i <= TOTAL_IMAGES; i++) {
    imageCards.push(createImageCard(i));
  }

  // choose random positions for videos among images
  const allCards = [...imageCards];

  VIDEO_PATHS.forEach((src, idx) => {
    const label = `darshni · trailer ${idx + 1}`;
    const videoCard = createVideoCard(src, label);

    // random index between 1 and allCards.length - 1
    // (so not always at very top or very bottom)
    const min = 1;
    const max = allCards.length - 1;
    const insertIndex = Math.floor(Math.random() * (max - min + 1)) + min;

    allCards.splice(insertIndex, 0, videoCard);
  });

  // append all to DOM in this mixed order
  allCards.forEach((card) => root.appendChild(card));

  // EXIF lazy loader for image cards only
  const options = {
    root: null,
    rootMargin: "120px",
    threshold: 0.12,
  };

  function loadCardData(entry, observer) {
    const card = entry.target;
    const idx = card.dataset.index;
    if (!idx) {
      observer.unobserve(card);
      return;
    }

    const imgPNG = card._img;
    const dateEl = card._date;
    const statusEl = card._status;

    if (imgPNG && imgPNG.dataset.src) {
      imgPNG.src = imgPNG.dataset.src;
      imgPNG.addEventListener("load", () => {
        imgPNG.classList.remove("lazy-blur");
      });
      delete imgPNG.dataset.src;
    }

    const imgJPG = new Image();
    imgJPG.src = `./img_jpg/c${idx}.jpg`;
    imgJPG.style.display = "none";

    imgJPG.onload = () => {
      EXIF.getData(imgJPG, function () {
        const raw =
          EXIF.getTag(this, "DateTimeOriginal") ||
          EXIF.getTag(this, "DateTimeDigitized") ||
          EXIF.getTag(this, "DateTime");

        if (raw) {
          const formatted = raw.replace(
            /^(\d{4}):(\d{2}):(\d{2})/,
            "$1-$2-$3"
          );
          dateEl.textContent = `Captured on: ${formatted}`;
          statusEl.textContent = "logged";
          statusEl.classList.remove("pending", "error");
        } else {
          dateEl.textContent = "No EXIF date found";
          statusEl.textContent = "no-meta";
          statusEl.classList.remove("pending");
          statusEl.classList.add("error");
        }
      });
    };

    imgJPG.onerror = () => {
      dateEl.textContent = "JPG metadata missing";
      statusEl.textContent = "missing";
      statusEl.classList.remove("pending");
      statusEl.classList.add("error");
    };

    card.appendChild(imgJPG);
    observer.unobserve(card);
  }

  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      loadCardData(entry, obs);
    });
  }, options);

  allCards.forEach((card) => {
    if (card.dataset && card.dataset.index) {
      observer.observe(card);
    }
  });
</script>


</body>
</html>
